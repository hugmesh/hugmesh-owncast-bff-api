# HugMesh CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Pull in the centralized OWASP pen-test stage (SCA + authenticated ZAP DAST) as
# hidden .pentest-* jobs from the generator. Single source of truth org-wide; the
# pentest:* jobs below `extends:` these. See hugmesh-pentest-standard.
include:
  - project: 'hugmesh/hugmesh-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, build, pentest]

# Run the unit/slice tests before the image build (./mvnw test). Keeps a broken
# overlay/guard from shipping an image. Matches the wiki-bff CI test stage.
test:unit:
  stage: test
  image: eclipse-temurin:25-jdk
  # The full-context @SpringBootTest tests now boot a real Testcontainers Postgres
  # (via the shared hugmesh-commons PostgresTestSupport), so the job needs a Docker
  # daemon. A docker:dind sidecar provides it; DOCKER_HOST points the test JVM's
  # docker-java client at the sidecar over TCP. Mirrors federation-api's #43 pattern.
  services:
    - docker:27-dind
  variables:
    # dind exposes the daemon on tcp://docker:2375 (TLS off inside the CI network).
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    # Ryuk (the Testcontainers reaper) needs extra socket privileges that the dind
    # sidecar does not grant cleanly; disable it — the dind daemon is torn down with
    # the job, so leaked containers cannot outlive the pipeline.
    TESTCONTAINERS_RYUK_DISABLED: "true"
    # This runner's docker-java negotiates an API version the daemon rejects unless the
    # version is pinned via the JVM system property (the DOCKER_API_VERSION env var does
    # NOT take effect — only the -Dapi.version sysprop does).
    MAVEN_OPTS: "-Dapi.version=1.43"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # `-s settings.xml` points Maven at the gitlab-maven GROUP registry so the PRIVATE
    # hugmesh-parent / hugmesh-commons artifacts resolve here (they are NOT on
    # Central and NOT in the runner's ~/.m2). Auth is the job-scoped ${env.CI_JOB_TOKEN}
    # GitLab already injects; the registry URL needs CI_API_V4_URL (auto) + GITLAB_GROUP_ID
    # (a CI/CD or group variable = the HugMesh group id). No secret in git.
    - ./mvnw -B -s settings.xml -DskipITs test
    # A clean tree after the build is the invariant — a test must never regenerate a
    # committed artefact. This catches any test that rewrites a checked-in file.
    - git diff --exit-code
      || { echo "BUILD REWROTE A COMMITTED FILE (see the diff above) — a test regenerated a checked-in artefact instead of asserting it. Regenerate locally and commit, or make that test assert."; exit 1; }

build:image:
  stage: build
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    # BuildKit is required for the Dockerfile's `--mount=type=secret` private-dep
    # resolution (hugmesh-commons from the GitLab Maven registry).
    DOCKER_BUILDKIT: "1"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # CI_JOB_TOKEN is passed as a BuildKit SECRET (never persisted in a layer); the
    # GitLab registry coordinates go in as build-args so the committed settings.xml
    # can resolve the PRIVATE hugmesh-commons artifact during `./mvnw package`
    # inside the build stage. GITLAB_GROUP_ID must be set to the HugMesh
    # group id (a CI/CD or group variable).
    - |
      docker build --pull \
        --secret id=ci_job_token,env=CI_JOB_TOKEN \
        --build-arg CI_API_V4_URL="$CI_API_V4_URL" \
        --build-arg GITLAB_GROUP_ID="$GITLAB_GROUP_ID" \
        -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# OWASP pen-test stage — wired from the centralized generator template via the
# `include:` above. Both jobs are allow_failure (non-blocking, advisory) and run
# only on the default branch + merge requests, mirroring this repo's security-job
# rules. The full harness (Dependency-Check SCA + ZAP baseline + probes + nuclei)
# is owned by the generator; these are thin `extends:` jobs.
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
